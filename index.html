<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Now Queueing</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12172B;
    --surface: #1C2340;
    --surface-raised: #232B4D;
    --gold: #D4A94F;
    --gold-dim: #8A7238;
    --text: #EDEAE0;
    --muted: #8B92B0;
    --watched: #6B9080;
    --removing: #A8583F;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); margin: 0; padding: 0; }
  body {
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 20px 16px 60px;
  }
  .wl-header { margin-bottom: 14px; }
  .wl-marquee {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 30px;
    letter-spacing: 0.5px; color: var(--gold); line-height: 1.1; margin: 0;
  }
  .wl-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .wl-sync { color: var(--muted); font-size: 11.5px; margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .wl-sync.error { color: var(--removing); }
  .wl-refresh-btn {
    background: none; border: 1px solid #313A63; color: var(--gold);
    border-radius: 6px; padding: 3px 9px; font-size: 11.5px; cursor: pointer; font-family: 'Inter', sans-serif;
  }

  .wl-addbtn {
    width: 100%; margin-top: 14px; background: var(--gold); color: #1A1300;
    border: none; border-radius: 8px; padding: 12px; font-family: 'Inter', sans-serif;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .wl-addbtn.secondary { background: var(--surface-raised); color: var(--gold); border: 1px solid var(--gold-dim); margin-top: 8px; }

  .wl-form {
    background: var(--surface); border-radius: 10px; padding: 16px; margin-top: 14px;
    display: none; flex-direction: column; gap: 10px;
  }
  .wl-form.open { display: flex; }
  .wl-form label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
  .wl-row { display: flex; gap: 10px; }
  .wl-row > div { flex: 1; min-width: 0; }
  .wl-form input, .wl-form select, .wl-form textarea {
    width: 100%; background: var(--bg); border: 1px solid #313A63; color: var(--text);
    border-radius: 6px; padding: 9px 10px; font-family: 'Inter', sans-serif; font-size: 14px;
  }
  .wl-form textarea { resize: none; height: 50px; }
  .wl-formbtns { display: flex; gap: 10px; margin-top: 4px; }
  .wl-formbtns button {
    flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: 600;
    font-size: 14px; cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .wl-save { background: var(--gold); color: #1A1300; }
  .wl-cancel { background: transparent; color: var(--muted); border: 1px solid #313A63 !important; }
  .wl-form-note { font-size: 11px; color: var(--muted); line-height: 1.4; margin: 0; }

  /* Search + filters */
  .wl-search { margin-top: 16px; position: relative; }
  .wl-search input {
    width: 100%; background: var(--surface); border: 1px solid #313A63; color: var(--text);
    border-radius: 8px; padding: 10px 34px 10px 12px; font-family: 'Inter', sans-serif; font-size: 14px;
  }
  .wl-search input::placeholder { color: var(--muted); }
  .wl-search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px; display: none;
  }
  .wl-search-clear.show { display: block; }

  .wl-toolbar { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .wl-toolbtn {
    background: var(--surface); border: 1px solid #313A63; color: var(--text); border-radius: 8px;
    padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif;
    display: flex; align-items: center; gap: 6px;
  }
  .wl-toolbtn.on { border-color: var(--gold-dim); color: var(--gold); }
  .wl-toolbtn.clear { color: #D98B72; border-color: #5a3a30; display: none; margin-left: auto; }
  .wl-toolbtn.clear.show { display: flex; }
  .wl-badge { background: var(--gold); color: #1A1300; border-radius: 10px; font-size: 11px; font-weight: 600; padding: 1px 7px; }

  .wl-fpanel { display: none; background: var(--surface); border-radius: 10px; padding: 14px; margin-top: 10px; }
  .wl-fpanel.open { display: block; }
  .wl-fgroup + .wl-fgroup { margin-top: 14px; }
  .wl-fgroup-label { font-size: 11px; color: var(--muted); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.6px; }
  .wl-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .wl-pill {
    flex: none; padding: 6px 12px; border-radius: 20px; background: var(--surface-raised);
    color: var(--muted); font-size: 12.5px; cursor: pointer; border: 1px solid transparent; white-space: nowrap;
  }
  .wl-pill.active { background: rgba(212,169,79,0.15); color: var(--gold); border-color: var(--gold-dim); }
  .wl-active { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .wl-active:empty { display: none; }
  .wl-result-count { font-size: 12px; color: var(--muted); margin-top: 14px; }

  .wl-list { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
  .wl-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 10px; line-height: 1.6; }
  .wl-empty button {
    margin-top: 12px; background: var(--surface-raised); color: var(--gold); border: 1px solid var(--gold-dim);
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif;
  }

  .wl-ticket { position: relative; background: var(--surface); border-radius: 8px; display: flex; overflow: hidden; }
  .wl-ticket.wl-watched { opacity: 0.55; }
  .wl-stub {
    width: 6px; flex: none;
    background: repeating-linear-gradient(to bottom, var(--gold-dim) 0px, var(--gold-dim) 6px, transparent 6px, transparent 12px);
  }
  .wl-ticket.wl-priority-high .wl-stub { background: repeating-linear-gradient(to bottom, var(--gold) 0px, var(--gold) 6px, transparent 6px, transparent 12px); }
  .wl-ticket.wl-priority-low .wl-stub { background: repeating-linear-gradient(to bottom, #445 0px, #445 6px, transparent 6px, transparent 12px); }

  .wl-body { flex: 1; padding: 14px 14px 12px 16px; min-width: 0; }
  .wl-toprow { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .wl-title { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 18px; line-height: 1.2; }
  .wl-title.done { text-decoration: line-through; text-decoration-color: var(--watched); }
  .wl-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .wl-tag { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--surface-raised); color: var(--muted); }
  .wl-tag.platform { color: var(--gold); }
  .wl-tag.custom { color: #9FB4D4; }
  .wl-notes { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.4; }

  .wl-actions { display: flex; flex-direction: column; gap: 6px; flex: none; }
  .wl-icon-btn { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 2px 4px; }
  .wl-icon-btn.check { color: var(--watched); }
  .wl-icon-btn.del { color: var(--removing); }

  .wl-statusbtn {
    margin-top: 10px; display: inline-block; font-size: 11.5px; padding: 5px 10px; border-radius: 6px;
    background: var(--surface-raised); color: var(--text); border: 1px solid #313A63; cursor: pointer;
  }

  /* TMDB lookup, posters, streaming */
  .wl-lookup-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .wl-suggest { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
  .wl-sug { display: flex; gap: 10px; align-items: center; background: var(--bg); border: 1px solid #313A63; border-radius: 8px; padding: 6px; cursor: pointer; }
  .wl-sug img, .wl-sug .noimg { width: 34px; height: 51px; border-radius: 4px; object-fit: cover; background: var(--surface-raised); flex: none; }
  .wl-sug-t { font-size: 13px; }
  .wl-sug-m { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .wl-stream-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .wl-stream-pick:empty { display: none; }
  .wl-poster { width: 52px; height: 78px; border-radius: 5px; object-fit: cover; flex: none; margin: 12px 0 12px 12px; align-self: flex-start; background: var(--surface-raised); display: block; }
  .wl-tag.rating { color: #E8C468; }
  .wl-stream { font-size: 11.5px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
  .wl-stream b { color: var(--text); font-weight: 500; }
  .wl-attrib { margin-top: 28px; font-size: 10.5px; color: var(--muted); line-height: 1.5; text-align: center; }
</style>
</head>
<body>
  <div class="wl-header">
    <p class="wl-marquee">NOW QUEUEING</p>
    <p class="wl-sub" id="wl-count">Loading your watchlist…</p>
    <div class="wl-sync" id="wl-sync">
      <span id="wl-sync-text">Syncing…</span>
      <button class="wl-refresh-btn" onclick="wlSyncFromSheet()">🔄 Refresh</button>
      <button class="wl-refresh-btn" id="wl-settings-btn" onclick="wlToggleSettings()">⚙ Set up movie details</button>
    </div>
    <button class="wl-addbtn" onclick="wlToggleForm()">+ Add a film (saves to sheet)</button>
    <button class="wl-addbtn secondary" id="wl-bulk-btn" onclick="wlBulkImport()">⬇ Import latest flyer titles</button>

    <div class="wl-form" id="wl-settings">
      <p class="wl-form-note" id="wl-settings-note"></p>
      <div>
        <label>TMDB API key or read-access token</label>
        <input id="s-key" type="password" autocomplete="off" placeholder="Paste your TMDB key or read-access token" />
      </div>
      <div>
        <label>Country for streaming info</label>
        <select id="s-country">
          <option value="IN">India</option>
          <option value="US">United States</option>
          <option value="GB">United Kingdom</option>
          <option value="CA">Canada</option>
          <option value="AU">Australia</option>
          <option value="AE">United Arab Emirates</option>
          <option value="SG">Singapore</option>
          <option value="MY">Malaysia</option>
          <option value="NZ">New Zealand</option>
          <option value="DE">Germany</option>
          <option value="FR">France</option>
          <option value="ZA">South Africa</option>
        </select>
      </div>
      <div class="wl-formbtns">
        <button class="wl-cancel" onclick="wlClearTmdbCache()">Clear saved details</button>
        <button class="wl-save" onclick="wlSaveSettings()">Save</button>
      </div>
    </div>

    <div class="wl-form" id="wl-form">
      <p class="wl-form-note" id="wl-form-context"></p>
      <div>
        <label>Title</label>
        <input id="f-title" placeholder="e.g. Paatal Lok" oninput="wlTitleTyped()" />
        <div class="wl-lookup-row">
          <button type="button" class="wl-refresh-btn" onclick="wlLookup()">🔍 Find on TMDB</button>
          <span class="wl-form-note" id="wl-lookup-status"></span>
        </div>
        <div class="wl-suggest" id="wl-suggest"></div>
        <div class="wl-stream-pick" id="wl-stream-pick"></div>
      </div>
      <div class="wl-row">
        <div>
          <label>Language</label>
          <select id="f-lang">
            <option value="">Select</option>
            <option value="Hindi">Hindi</option>
            <option value="English">English</option>
            <option value="Telugu">Telugu</option>
            <option value="Tamil">Tamil</option>
            <option value="Malayalam">Malayalam</option>
            <option value="Asian">Asian</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label>Platform</label>
          <select id="f-platform">
            <option value="">Select</option>
            <option value="Prime Video">Prime Video</option>
            <option value="Netflix">Netflix</option>
            <option value="Jio Hotstar">Jio Hotstar</option>
            <option value="Zee 5">Zee 5</option>
            <option value="Apple TV">Apple TV</option>
            <option value="Aha">Aha</option>
            <option value="Starz">Starz</option>
            <option value="Simply South">Simply South</option>
            <option value="Disney+">Disney+</option>
            <option value="Hulu">Hulu</option>
            <option value="SunNxt">SunNxt</option>
            <option value="HBOMax">HBOMax</option>
            <option value="Sony LIV">Sony LIV</option>
            <option value="ETV Win">ETV Win</option>
            <option value="Peacock">Peacock</option>
          </select>
        </div>
      </div>
      <div class="wl-row">
        <div>
          <label>Type</label>
          <select id="f-type">
            <option value="">Select</option>
            <option value="Movie">Movie</option>
            <option value="Series">Series</option>
          </select>
        </div>
        <div>
          <label>Priority</label>
          <select id="f-priority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>
      <div>
        <label>Genre</label>
        <select id="f-genre">
          <option value="">Select</option>
          <option value="Action">Action</option>
          <option value="Comedy">Comedy</option>
          <option value="Romance">Romance</option>
          <option value="Thriller">Thriller</option>
          <option value="Horror">Horror</option>
          <option value="Suspense">Suspense</option>
          <option value="Crime">Crime</option>
          <option value="Adventure">Adventure</option>
          <option value="Animation">Animation</option>
          <option value="Drama">Drama</option>
          <option value="Fantasy">Fantasy</option>
          <option value="Sci-Fi">Sci-Fi</option>
          <option value="Mystery">Mystery</option>
          <option value="Family">Family</option>
          <option value="Documentary">Documentary</option>
          <option value="Reality">Reality</option>
          <option value="Musical">Musical</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div>
        <label>Notes (optional)</label>
        <textarea id="f-notes" placeholder="Why you want to watch it, who recommended it…"></textarea>
      </div>
      <div class="wl-formbtns">
        <button class="wl-cancel" onclick="wlToggleForm()">Cancel</button>
        <button class="wl-save" onclick="wlSave()">Save</button>
      </div>
    </div>
  </div>

  <div class="wl-search">
    <input id="wl-search-input" type="text" placeholder="Search title, notes… (several words work together)" oninput="wlOnSearch()" />
    <button class="wl-search-clear" id="wl-search-clear" onclick="wlClearSearch()">✕</button>
  </div>
  <div class="wl-toolbar">
    <button class="wl-toolbtn" id="wl-filters-btn" onclick="wlToggleFilters()">
      <span id="wl-filters-arrow">▾</span> Filters <span class="wl-badge" id="wl-filters-badge" style="display:none">0</span>
    </button>
    <button class="wl-toolbtn clear" id="wl-clear-btn" onclick="wlClearAll()">✕ Clear all</button>
  </div>
  <div class="wl-active" id="wl-active"></div>
  <div class="wl-fpanel" id="wl-fpanel"></div>
  <div class="wl-result-count" id="wl-result-count"></div>
  <div class="wl-list" id="wl-list"></div>
  <div class="wl-attrib">Movie details from TMDB. Streaming availability data provided by JustWatch via TMDB.<br/>This product uses the TMDB API but is not endorsed or certified by TMDB.</div>

<script>
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOxZJiwrf5qM-XNXrr6HgX0W3BoLpitMDTO4JTNr1h7DRy51L_9NI18TMsuBGULluIFWDs3RAq2S-H/pub?gid=0&single=true&output=csv";
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwE70_QV5GOGam2E8u9Pzt6e-ZB_OYClKzGkkC6bKVGWMMb-pRd7pf-0onXoCL_hbV4/exec";

  const LS_OVERRIDES = 'wl-overrides';   // { titleKey: {status, priority, notes, platform, language, type, genre} }
  const LS_HIDDEN = 'wl-hidden';         // [titleKey, ...] sheet rows hidden on this device
  const LS_PENDING = 'wl-pending-adds';  // items sent to the sheet but not yet seen in a sync
  const LS_CACHE = 'wl-sheet-cache';     // { rows: [...], syncedAt: ts }
  const LS_RENAMED = 'wl-renamed';       // { oldTitleKey: true } old sheet rows hidden while a rename of a just-added title syncs

  let sheetItems = [];
  let pendingAdds = [];
  let overrides = {};
  let hidden = [];
  let renamedAway = {};
  let editingId = null;
  let lastSynced = null;
  let searchQuery = '';
  let filtersOpen = false;
  let filters = { status: ['to_watch'], type: [], platform: [], language: [], genre: [], priority: [] };

  // ---------- helpers ----------
  function keyOf(title) { return (title || '').trim().toLowerCase(); }
  function capFirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function statusLabel(s) { return s === 'to_watch' ? 'To watch' : s === 'watching' ? 'Watching' : 'Watched'; }
  function statusForSheet(s) { return s === 'to_watch' ? 'To Watch' : s === 'watching' ? 'Watching' : 'Watched'; }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
  function escAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function readLS(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  }
  function writeLS(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  const FACETS = [
    { key: 'status',   label: 'Status',   order: ['to_watch', 'watching', 'watched'], fmt: statusLabel, always: true },
    { key: 'type',     label: 'Type',     selectId: 'f-type' },
    { key: 'platform', label: 'Platform', selectId: 'f-platform' },
    { key: 'language', label: 'Language', selectId: 'f-lang' },
    { key: 'genre',    label: 'Genre',    selectId: 'f-genre' },
    { key: 'priority', label: 'Priority', order: ['high', 'medium', 'low'], fmt: capFirst }
  ];

  function facetOrder(f) {
    if (f.order) return f.order;
    const sel = document.getElementById(f.selectId);
    return sel ? Array.from(sel.options).map(o => o.value).filter(Boolean) : [];
  }
  function sortByOrder(values, order) {
    return values.slice().sort((a, b) => {
      const ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return a.localeCompare(b);
    });
  }

  // ---------- legacy "Genre" values (e.g. "Series - S1") -> Type + Genre ----------
  const LEGACY_RE = /^(movie|series|docu-series|reality series|musical concert)\b/i;

  function splitLegacy(raw, typeAlreadySet) {
    const s = (raw || '').trim();
    const isLegacy = LEGACY_RE.test(s) || (!typeAlreadySet && /^documentary$/i.test(s));
    if (!isLegacy) return null;
    const season = ((s.match(/\bS\d+\b/i) || [''])[0]).toUpperCase();
    const type = /series/i.test(s) ? 'Series' : 'Movie';
    let genre = '';
    if (/docu/i.test(s)) genre = 'Documentary';
    else if (/reality/i.test(s)) genre = 'Reality';
    else if (/musical/i.test(s)) genre = 'Musical';
    return { type, genre, season };
  }

  function normType(t) {
    const v = (t || '').trim().toLowerCase();
    return v === 'movie' ? 'Movie' : v === 'series' ? 'Series' : '';
  }

  function normalizeRow(r) {
    let type = normType(r.type);
    let genre = (r.genre || '').trim();
    let notes = r.notes || '';
    const legacy = splitLegacy(genre, !!type);
    if (legacy) {
      if (!type) type = legacy.type;
      genre = legacy.genre;
      if (legacy.season && !new RegExp('\\b' + legacy.season + '\\b', 'i').test(notes)) {
        notes = notes ? legacy.season + ' · ' + notes : legacy.season;
      }
    }
    return { ...r, type, genre, notes };
  }

  // Fire-and-forget write to the Apps Script endpoint (no-cors: we can't read the reply).
  function wlWriteToSheet(payload) {
    try {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(() => {});
    } catch (e) {}
  }

  // ---------- CSV ----------
  function parseCSV(text) {
    const rows = [];
    let i = 0, field = '', row = [], inQuotes = false;
    while (i < text.length) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      } else {
        if (c === '"') { inQuotes = true; i++; continue; }
        if (c === ',') { row.push(field); field = ''; i++; continue; }
        if (c === '\r') { i++; continue; }
        if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
        field += c; i++; continue;
      }
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows;
  }

  function rowsToItems(rows) {
    if (!rows.length) return [];
    const headers = rows[0].map(h => h.trim().toLowerCase());
    return rows.slice(1)
      .filter(r => r.some(c => c.trim() !== ''))
      .map(r => {
        const obj = {};
        headers.forEach((h, idx) => obj[h] = (r[idx] || '').trim());
        return normalizeRow({
          title: obj.title || 'Untitled',
          language: obj.language || '',
          platform: obj.platform || '',
          type: obj.type || '',
          genre: obj.genre || '',
          priority: (obj.priority || 'medium').toLowerCase(),
          notes: obj.notes || '',
          status: (obj.status || 'to watch').toLowerCase().replace(/\s+/g, '_')
        });
      });
  }

  async function wlSyncFromSheet() {
    const syncText = document.getElementById('wl-sync-text');
    const syncBox = document.getElementById('wl-sync');
    syncText.textContent = 'Syncing…';
    syncBox.classList.remove('error');
    try {
      const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('Fetch failed');
      const text = await res.text();
      const parsed = rowsToItems(parseCSV(text));
      sheetItems = parsed;
      lastSynced = Date.now();
      writeLS(LS_CACHE, { rows: parsed, syncedAt: lastSynced });

      const sheetKeys = new Set(parsed.map(i => keyOf(i.title)));
      pendingAdds = pendingAdds.filter(p => !sheetKeys.has(keyOf(p.title)));
      writeLS(LS_PENDING, pendingAdds);

      // renames: once the sheet shows the new title, drop the local title override / hidden old row
      Object.keys(overrides).forEach(k => {
        const ov = overrides[k];
        if (!ov || !ov.title) return;
        const row = parsed.find(r => keyOf(r.title) === k);
        if (row && row.title === ov.title) {
          delete ov.title;
        } else if (!row && sheetKeys.has(keyOf(ov.title))) {
          const nk = keyOf(ov.title);
          const moved = { ...ov }; delete moved.title;
          overrides[nk] = { ...moved, ...(overrides[nk] || {}) };
          delete overrides[k];
        }
      });
      writeLS(LS_OVERRIDES, overrides);
      Object.keys(renamedAway).forEach(k => { if (!sheetKeys.has(k)) delete renamedAway[k]; });
      writeLS(LS_RENAMED, renamedAway);

      syncText.textContent = 'Synced just now from sheet';
    } catch (e) {
      const cached = readLS(LS_CACHE, null);
      if (cached) {
        sheetItems = cached.rows.map(normalizeRow);
        lastSynced = cached.syncedAt;
        syncText.textContent = 'Offline — showing data from last sync (' + new Date(lastSynced).toLocaleString() + ')';
        syncBox.classList.add('error');
      } else {
        sheetItems = [];
        syncText.textContent = 'Could not load sheet, and no cached data yet';
        syncBox.classList.add('error');
      }
    }
    render();
  }

  // ---------- add / edit form ----------
  function resetForm() {
    ['f-title', 'f-notes'].forEach(id => document.getElementById(id).value = '');
    ['f-lang', 'f-platform', 'f-type', 'f-genre'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-priority').value = 'medium';
    document.getElementById('wl-form-context').textContent = '';
    clearLookupUI();
  }

  function wlToggleForm() {
    editingId = null;
    const form = document.getElementById('wl-form');
    form.classList.toggle('open');
    if (form.classList.contains('open')) resetForm();
  }

  function sheetPayload(fields) {
    return {
      title: fields.title,
      language: fields.language,
      platform: fields.platform,
      type: fields.type,
      genre: fields.genre,
      priority: capFirst(fields.priority),
      notes: fields.notes
    };
  }

  function wlSave() {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { document.getElementById('f-title').focus(); return; }
    const fields = {
      title,
      language: document.getElementById('f-lang').value,
      platform: document.getElementById('f-platform').value,
      type: document.getElementById('f-type').value,
      genre: document.getElementById('f-genre').value,
      priority: document.getElementById('f-priority').value,
      notes: document.getElementById('f-notes').value.trim()
    };

    const editItem = editingId ? getMergedItems().find(i => i._id === editingId) : null;
    const origTitle = editItem ? editItem.title : '';
    const titleChanged = !!editItem && fields.title !== origTitle;

    if (editingId && editingId.startsWith('sheet:')) {
      const tKey = editingId.slice(6);
      overrides[tKey] = {
        ...(overrides[tKey] || {}),
        priority: fields.priority, notes: fields.notes, platform: fields.platform,
        language: fields.language, type: fields.type, genre: fields.genre
      };
      if (titleChanged) overrides[tKey].title = fields.title;
      writeLS(LS_OVERRIDES, overrides);
      wlWriteToSheet({ action: 'update', oldTitle: origTitle, ...sheetPayload(fields) });
    } else if (editingId && editingId.startsWith('pending:')) {
      const idx = pendingAdds.findIndex(p => p.title === editingId.slice(8));
      if (idx > -1) pendingAdds[idx] = { ...pendingAdds[idx], ...fields };
      writeLS(LS_PENDING, pendingAdds);
      if (titleChanged && keyOf(fields.title) !== keyOf(origTitle)) {
        renamedAway[keyOf(origTitle)] = true;   // hide the old-title row if the sheet snapshot still has it
        writeLS(LS_RENAMED, renamedAway);
      }
      wlWriteToSheet({ action: 'update', oldTitle: origTitle, ...sheetPayload(fields) });
    } else {
      pendingAdds.unshift({ ...fields, status: 'to_watch', added: Date.now() });
      writeLS(LS_PENDING, pendingAdds);
      wlWriteToSheet({ action: 'add', ...sheetPayload(fields), status: 'To Watch' });
    }
    if (formMatch) {
      tmdbCache[keyOf(fields.title)] = { ...formMatch, manual: true };
      saveTmdbCacheSoon();
      formMatch = null;
    }
    editingId = null;
    document.getElementById('wl-form').classList.remove('open');
    render();
  }

  function wlEdit(id, kind) {
    const item = getMergedItems().find(i => i._id === id);
    if (!item) return;
    editingId = id;
    clearLookupUI();
    document.getElementById('f-title').value = item.title;
    document.getElementById('f-lang').value = item.language || '';
    document.getElementById('f-platform').value = item.platform || '';
    document.getElementById('f-type').value = item.type || '';
    document.getElementById('f-genre').value = item.genre || '';
    document.getElementById('f-priority').value = item.priority || 'medium';
    document.getElementById('f-notes').value = item.notes || '';
    document.getElementById('wl-form-context').textContent = kind === 'sheet'
      ? 'Changes save straight to your sheet. You can fix the title here too.'
      : 'This was just added and is syncing to your sheet — it should be confirmed within a few minutes.';
    document.getElementById('wl-form').classList.add('open');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function wlDelete(id, kind) {
    if (kind === 'sheet') {
      const tKey = id.slice(6);
      if (!hidden.includes(tKey)) hidden.push(tKey);
      writeLS(LS_HIDDEN, hidden);
      // Hides it on this device only; delete the row in the sheet to remove it everywhere.
    } else {
      pendingAdds = pendingAdds.filter(p => p.title !== id.slice(8));
      writeLS(LS_PENDING, pendingAdds);
    }
    render();
  }

  function wlCycleStatus(id, kind) {
    const order = ['to_watch', 'watching', 'watched'];
    if (kind === 'sheet') {
      const tKey = id.slice(6);
      const src = sheetItems.find(i => keyOf(i.title) === tKey);
      const current = (overrides[tKey] && overrides[tKey].status) || (src && src.status) || 'to_watch';
      const next = order[(order.indexOf(current) + 1) % order.length];
      overrides[tKey] = { ...(overrides[tKey] || {}), status: next };
      writeLS(LS_OVERRIDES, overrides);
      wlWriteToSheet({ action: 'update', title: (overrides[tKey] && overrides[tKey].title) || (src ? src.title : tKey), status: statusForSheet(next) });
    } else {
      const t = id.slice(8);
      pendingAdds = pendingAdds.map(p => {
        if (p.title !== t) return p;
        return { ...p, status: order[(order.indexOf(p.status) + 1) % order.length] };
      });
      writeLS(LS_PENDING, pendingAdds);
      const item = pendingAdds.find(p => p.title === t);
      if (item) wlWriteToSheet({ action: 'update', title: t, status: statusForSheet(item.status) });
    }
    render();
  }

  // ---------- merged view ----------
  function getMergedItems() {
    const visible = sheetItems.filter(i => !hidden.includes(keyOf(i.title)) && !renamedAway[keyOf(i.title)]);
    const fromSheet = visible.map(i => {
      const tKey = keyOf(i.title);
      const ov = overrides[tKey] || {};
      return normalizeRow({
        _id: 'sheet:' + tKey,
        title: ov.title || i.title,
        language: ov.language !== undefined ? ov.language : i.language,
        platform: ov.platform !== undefined ? ov.platform : i.platform,
        type: ov.type !== undefined ? ov.type : i.type,
        genre: ov.genre !== undefined ? ov.genre : i.genre,
        priority: ov.priority || i.priority || 'medium',
        notes: ov.notes !== undefined ? ov.notes : i.notes,
        status: ov.status || i.status || 'to_watch',
        kind: 'sheet'
      });
    });
    const fromPending = pendingAdds.map(p => ({ ...normalizeRow(p), _id: 'pending:' + p.title, kind: 'pending' }));
    return [...fromPending, ...fromSheet];
  }

  // ---------- search + multi-filters ----------
  function wlOnSearch() {
    searchQuery = document.getElementById('wl-search-input').value.trim().toLowerCase();
    render();
  }
  function wlClearSearch() {
    searchQuery = '';
    document.getElementById('wl-search-input').value = '';
    render();
  }
  function wlToggleFilters() { filtersOpen = !filtersOpen; render(); }
  function wlToggleFilter(facet, val) {
    const arr = filters[facet];
    if (!arr) return;
    const i = arr.indexOf(val);
    if (i === -1) arr.push(val); else arr.splice(i, 1);
    render();
  }
  function wlClearAll() {
    Object.keys(filters).forEach(k => filters[k] = []);
    searchQuery = '';
    document.getElementById('wl-search-input').value = '';
    render();
  }
  function activeFilterCount() {
    return Object.keys(filters).reduce((n, k) => n + filters[k].length, 0);
  }

  function matchesSearch(item) {
    if (!searchQuery) return true;
    const haystack = [item.title, item.language, item.platform, item.type, item.genre, item.notes]
      .join(' ').toLowerCase();
    return searchQuery.split(/\s+/).every(term => haystack.includes(term));
  }
  function matchesFilters(item) {
    for (const f of FACETS) {
      const sel = filters[f.key];
      if (sel.length && !sel.includes(item[f.key])) return false;
    }
    return matchesSearch(item);
  }

  const priorityRank = { high: 0, medium: 1, low: 2 };

  function renderFilterUI(all) {
    const panel = document.getElementById('wl-fpanel');
    panel.classList.toggle('open', filtersOpen);
    document.getElementById('wl-filters-arrow').textContent = filtersOpen ? '▴' : '▾';
    document.getElementById('wl-filters-btn').classList.toggle('on', filtersOpen || activeFilterCount() > 0);

    if (filtersOpen) {
      panel.innerHTML = FACETS.map(f => {
        const present = Array.from(new Set(all.map(i => i[f.key]).filter(Boolean)));
        const values = sortByOrder(
          Array.from(new Set([...(f.always ? f.order : []), ...present, ...filters[f.key]])),
          facetOrder(f)
        );
        if (!values.length) return '';
        return '<div class="wl-fgroup"><div class="wl-fgroup-label">' + f.label + '</div><div class="wl-chips">' +
          values.map(v =>
            '<div class="wl-pill ' + (filters[f.key].includes(v) ? 'active' : '') + '" data-facet="' + f.key +
            '" data-val="' + escAttr(v) + '">' + escapeHtml(f.fmt ? f.fmt(v) : v) + '</div>'
          ).join('') + '</div></div>';
      }).join('');
    }

    const strip = [];
    FACETS.forEach(f => filters[f.key].forEach(v => {
      strip.push('<div class="wl-pill active" data-facet="' + f.key + '" data-val="' + escAttr(v) + '">' +
        escapeHtml(f.fmt ? f.fmt(v) : v) + ' ✕</div>');
    }));
    document.getElementById('wl-active').innerHTML = strip.join('');

    const n = activeFilterCount();
    const badge = document.getElementById('wl-filters-badge');
    badge.style.display = n > 0 ? '' : 'none';
    badge.textContent = n;
    document.getElementById('wl-clear-btn').classList.toggle('show', n > 0 || !!searchQuery);
    document.getElementById('wl-search-clear').classList.toggle('show', !!searchQuery);
  }

  function render() {
    const all = getMergedItems();
    document.getElementById('wl-count').textContent =
      all.length === 0 ? 'Your watchlist is empty.' :
      all.filter(i => i.status !== 'watched').length + ' to go · ' +
      all.filter(i => i.status === 'watched').length + ' watched · ' + all.length + ' total';

    renderFilterUI(all);
    document.getElementById('wl-settings-btn').textContent =
      !tmdbKey() ? '⚙ Set up movie details' : tmdbAuthBad ? '⚠ Check TMDB key' : '⚙ Movie details';

    const list = all.filter(matchesFilters).sort((a, b) =>
      (priorityRank[a.priority] ?? 1) - (priorityRank[b.priority] ?? 1)
    );
    enrichVisible(list);
    const loading = enrichQueue.length + enrichActive;
    document.getElementById('wl-result-count').textContent =
      all.length ? 'Showing ' + list.length + ' of ' + all.length +
        (loading ? ' · loading posters & streaming info (' + loading + ' left)' : '') : '';

    const listEl = document.getElementById('wl-list');
    if (list.length === 0) {
      const filtered = activeFilterCount() > 0 || searchQuery;
      listEl.innerHTML = '<div class="wl-empty">' +
        (filtered ? 'No matches for the current search and filters.<br/><button data-act="clearall">Clear all</button>'
                  : 'Nothing here yet.<br/>Tap "+ Add a film" to start.') + '</div>';
      return;
    }

    listEl.innerHTML = list.map(i => {
      const pr = priorityRank[i.priority] !== undefined ? i.priority : 'medium';
      const ref = 'data-id="' + escAttr(i._id) + '" data-kind="' + i.kind + '"';
      const te = tmdbCache[keyOf(i.title)];
      const hasTe = !!(te && !te.miss);
      const posterHtml = hasTe && te.poster
        ? '<a href="https://www.themoviedb.org/' + te.mt + '/' + te.id + '" target="_blank" rel="noopener">' +
          '<img class="wl-poster" loading="lazy" alt="" src="https://image.tmdb.org/t/p/w154' + escAttr(te.poster) + '"></a>'
        : '';
      const extraTags = hasTe
        ? (te.rating ? '<span class="wl-tag rating">★ ' + te.rating.toFixed(1) + '</span>' : '') +
          (te.year ? '<span class="wl-tag">' + escapeHtml(te.year) + '</span>' : '')
        : '';
      const streamHtml = hasTe && te.provAt
        ? '<div class="wl-stream">' + (te.providers && te.providers.length
            ? 'Streaming in ' + escapeHtml(te.cc) + ': <b>' + te.providers.map(escapeHtml).join(' · ') + '</b>'
            : 'No subscription streaming listed in ' + escapeHtml(te.cc)) + '</div>'
        : '';
      return '<div class="wl-ticket wl-priority-' + pr + (i.status === 'watched' ? ' wl-watched' : '') + '">' +
        '<div class="wl-stub"></div>' + posterHtml + '<div class="wl-body">' +
        '<div class="wl-toprow"><div class="wl-title' + (i.status === 'watched' ? ' done' : '') + '">' + escapeHtml(i.title) + '</div>' +
        '<div class="wl-actions">' +
          '<button class="wl-icon-btn check" data-act="cycle" ' + ref + ' title="Change status">✓</button>' +
          '<button class="wl-icon-btn" data-act="edit" ' + ref + ' title="Edit">✎</button>' +
          '<button class="wl-icon-btn del" data-act="del" ' + ref + ' title="Remove">✕</button>' +
        '</div></div>' +
        '<div class="wl-meta">' +
          (i.platform ? '<span class="wl-tag platform">' + escapeHtml(i.platform) + '</span>' : '') +
          (i.language ? '<span class="wl-tag">' + escapeHtml(i.language) + '</span>' : '') +
          (i.type ? '<span class="wl-tag">' + escapeHtml(i.type) + '</span>' : '') +
          (i.genre ? '<span class="wl-tag">' + escapeHtml(i.genre) + '</span>' : '') +
          (i.kind === 'pending' ? '<span class="wl-tag custom">Syncing…</span>' : '') + extraTags +
        '</div>' +
        (i.notes ? '<div class="wl-notes">' + escapeHtml(i.notes) + '</div>' : '') + streamHtml +
        '<div class="wl-statusbtn" data-act="cycle" ' + ref + '>' + statusLabel(i.status) + ' · tap to change</div>' +
        '</div></div>';
    }).join('');
  }

  // ---------- TMDB: details, posters, streaming ----------
  const LS_TMDB_KEY = 'wl-tmdb-key';
  const LS_TMDB_CC = 'wl-tmdb-country';
  const LS_TMDB_CACHE = 'wl-tmdb-cache';   // titleKey -> { id, mt, name, year, poster, rating, lang, genres, providers, provAt, cc } | { miss, at }
  const DAY = 86400000;

  let tmdbCache = {};
  let formMatch = null;
  let suggestResults = [];
  let suggestTimer = null;
  let lookupSeq = 0;
  let tmdbAuthBad = false;
  let enrichQueue = [];
  let enrichActive = 0;
  const enrichInflight = new Set();
  const enrichFailed = new Set();
  let cacheTimer = null;
  let softTimer = null;

  function tmdbKey() { return String(readLS(LS_TMDB_KEY, '') || '').trim(); }
  function tmdbCountry() { return readLS(LS_TMDB_CC, 'IN') || 'IN'; }

  const TMDB_LANG = { hi: 'Hindi', en: 'English', te: 'Telugu', ta: 'Tamil', ml: 'Malayalam',
    ko: 'Asian', ja: 'Asian', zh: 'Asian', cn: 'Asian', th: 'Asian', id: 'Asian', ms: 'Asian', tl: 'Asian', vi: 'Asian' };
  function mapLang(code) { return code ? (TMDB_LANG[code] || 'Other') : ''; }

  const TMDB_GENRE = { 28: 'Action', 12: 'Adventure', 16: 'Animation', 35: 'Comedy', 80: 'Crime', 99: 'Documentary',
    18: 'Drama', 10751: 'Family', 14: 'Fantasy', 27: 'Horror', 9648: 'Mystery', 10749: 'Romance', 878: 'Sci-Fi',
    53: 'Thriller', 10402: 'Musical', 10759: 'Action', 10765: 'Sci-Fi', 10764: 'Reality', 10762: 'Family' };
  function mapGenres(ids) {
    const out = [];
    (ids || []).forEach(id => { const g = TMDB_GENRE[id]; if (g && !out.includes(g)) out.push(g); });
    return out;
  }
  function primaryGenre(list) { return list.find(g => g !== 'Drama') || list[0] || ''; }

  const PROVIDER_MAP = [
    [/netflix/i, 'Netflix'], [/prime video|amazon/i, 'Prime Video'], [/hotstar/i, 'Jio Hotstar'], [/zee ?5/i, 'Zee 5'],
    [/sony ?liv/i, 'Sony LIV'], [/^aha/i, 'Aha'], [/sun ?nxt/i, 'SunNxt'], [/apple tv/i, 'Apple TV'], [/disney/i, 'Disney+'],
    [/hulu/i, 'Hulu'], [/hbo|^max$/i, 'HBOMax'], [/peacock/i, 'Peacock'], [/etv ?win/i, 'ETV Win'],
    [/starz/i, 'Starz'], [/simply ?south/i, 'Simply South']
  ];
  function mapProvider(name) {
    for (const [re, out] of PROVIDER_MAP) if (re.test(name)) return out;
    return name;
  }
  function extractProviders(data, cc) {
    const r = data && data.results && data.results[cc];
    if (!r) return { names: [], link: '' };
    const names = [];
    ['flatrate', 'free', 'ads'].forEach(k => (r[k] || []).forEach(p => {
      const n = mapProvider(p.provider_name || '');
      if (n && !names.includes(n)) names.push(n);
    }));
    return { names, link: r.link || '' };
  }

  async function tmdb(path, params) {
    const key = tmdbKey();
    if (!key) { const e = new Error('nokey'); e.code = 'nokey'; throw e; }
    const u = new URL('https://api.themoviedb.org/3' + path);
    Object.entries(params || {}).forEach(([k, v]) => u.searchParams.set(k, v));
    const opts = {};
    if (key.length > 40) opts.headers = { Authorization: 'Bearer ' + key, accept: 'application/json' };
    else u.searchParams.set('api_key', key);
    const res = await fetch(u.toString(), opts);
    if (res.status === 401) { const e = new Error('auth'); e.code = 401; throw e; }
    if (!res.ok) { const e = new Error('http ' + res.status); e.code = res.status; throw e; }
    return res.json();
  }
  async function tmdbSearch(q) {
    const data = await tmdb('/search/multi', { query: q, include_adult: 'false', language: 'en-US', page: '1' });
    return (data.results || []).filter(r => r.media_type === 'movie' || r.media_type === 'tv');
  }

  function entryFromResult(r) {
    const date = r.release_date || r.first_air_date || '';
    return {
      id: r.id, mt: r.media_type,
      name: r.title || r.name || '',
      year: date ? date.slice(0, 4) : '',
      poster: r.poster_path || '',
      rating: r.vote_count > 0 && r.vote_average ? Math.round(r.vote_average * 10) / 10 : null,
      lang: r.original_language || '',
      genres: mapGenres(r.genre_ids),
      providers: null, link: '', provAt: 0, cc: '', at: Date.now()
    };
  }

  function normTitle(s) {
    const raw = String(s || '').toLowerCase();
    const n = raw.replace(/&/g, ' and ').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\b(the|a|an)\b/g, ' ').replace(/\s+/g, ' ').trim();
    return n || raw.trim();
  }

  // Only accept a search hit when its title really matches (and Movie/Series agrees when known);
  // a missing poster is better than a wrong one.
  function pickBest(results, item) {
    const wantMt = item.type === 'Movie' ? 'movie' : item.type === 'Series' ? 'tv' : null;
    const q = normTitle(item.title);
    let best = null, bestScore = 0;
    results.slice(0, 8).forEach((r, idx) => {
      if (wantMt && r.media_type !== wantMt) return;
      const names = [r.title, r.name, r.original_title, r.original_name].filter(Boolean).map(normTitle);
      let score = 0;
      if (names.includes(q)) score = 10;
      else if (names.some(n => n && q && (n.includes(q) || q.includes(n)) &&
               Math.min(n.length, q.length) / Math.max(n.length, q.length) >= 0.75)) score = 6;
      if (!score) return;
      if (item.language && item.language !== 'Other' && mapLang(r.original_language) === item.language) score += 2;
      score -= idx * 0.1;
      if (score > bestScore) { best = r; bestScore = score; }
    });
    return best;
  }

  function needsProviders(e) {
    return !e.provAt || e.cc !== tmdbCountry() || (Date.now() - e.provAt) > 7 * DAY;
  }
  function needsWork(item) {
    const e = tmdbCache[keyOf(item.title)];
    if (!e) return true;
    if (e.miss) return (Date.now() - e.at) > 14 * DAY;
    return needsProviders(e);
  }

  async function enrichOne(item) {
    const key = keyOf(item.title);
    let e = tmdbCache[key];
    if (!e || e.miss) {
      const results = await tmdbSearch(item.title);
      const best = pickBest(results, item);
      if (!best) { tmdbCache[key] = { miss: true, at: Date.now() }; return; }
      e = entryFromResult(best);
      tmdbCache[key] = e;
    }
    if (needsProviders(e)) {
      const data = await tmdb('/' + e.mt + '/' + e.id + '/watch/providers');
      const p = extractProviders(data, tmdbCountry());
      e.providers = p.names; e.link = p.link; e.provAt = Date.now(); e.cc = tmdbCountry();
    }
  }

  function saveTmdbCacheSoon() {
    if (cacheTimer) return;
    cacheTimer = setTimeout(() => { cacheTimer = null; writeLS(LS_TMDB_CACHE, tmdbCache); }, 1000);
  }
  function softRender() {
    if (softTimer) return;
    softTimer = setTimeout(() => { softTimer = null; render(); }, 1500);
  }

  function enrichVisible(list) {
    if (!tmdbKey() || tmdbAuthBad) return;
    const seen = new Set();
    enrichQueue = [];
    list.forEach(i => {
      const k = keyOf(i.title);
      if (seen.has(k) || enrichInflight.has(k) || enrichFailed.has(k) || !needsWork(i)) return;
      seen.add(k);
      enrichQueue.push({ title: i.title, type: i.type, language: i.language });
    });
    pump();
  }

  function pump() {
    while (enrichActive < 3 && enrichQueue.length) {
      const it = enrichQueue.shift();
      const k = keyOf(it.title);
      if (enrichInflight.has(k)) continue;
      enrichInflight.add(k);
      enrichActive++;
      enrichOne(it).catch(err => {
        if (err && err.code === 401) { tmdbAuthBad = true; enrichQueue = []; }
        else enrichFailed.add(k);
      }).finally(() => {
        enrichInflight.delete(k);
        enrichActive--;
        saveTmdbCacheSoon();
        softRender();
        setTimeout(pump, 150);
      });
    }
  }

  // ---------- settings ----------
  function fillSettings(msg) {
    const keyEl = document.getElementById('s-key');
    keyEl.value = '';
    keyEl.placeholder = tmdbKey() ? '•••• key saved on this device (paste to replace)' : 'Paste your TMDB key or read-access token';
    document.getElementById('s-country').value = tmdbCountry();
    document.getElementById('wl-settings-note').textContent = msg ||
      'Posters, ratings and streaming info come from TMDB. Your key stays on this device only. Get a free key at themoviedb.org → Settings → API.';
  }
  function wlToggleSettings() {
    const el = document.getElementById('wl-settings');
    el.classList.toggle('open');
    if (el.classList.contains('open')) fillSettings(tmdbAuthBad ? 'TMDB rejected the saved key — paste a valid one.' : '');
  }
  function openSettings(msg) {
    document.getElementById('wl-settings').classList.add('open');
    fillSettings(msg);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function wlSaveSettings() {
    const key = document.getElementById('s-key').value.trim();
    if (key) writeLS(LS_TMDB_KEY, key);
    writeLS(LS_TMDB_CC, document.getElementById('s-country').value || 'IN');
    tmdbAuthBad = false;
    enrichFailed.clear();
    document.getElementById('wl-settings').classList.remove('open');
    render();
  }
  function wlClearTmdbCache() {
    tmdbCache = {};
    writeLS(LS_TMDB_CACHE, tmdbCache);
    enrichFailed.clear();
    document.getElementById('wl-settings').classList.remove('open');
    render();
  }

  // ---------- title lookup inside the add/edit form ----------
  function setSelectIfPresent(id, val) {
    const sel = document.getElementById(id);
    if (val && Array.from(sel.options).some(o => o.value === val)) sel.value = val;
  }
  function clearLookupUI() {
    formMatch = null;
    suggestResults = [];
    clearTimeout(suggestTimer);
    lookupSeq++;
    document.getElementById('wl-suggest').innerHTML = '';
    document.getElementById('wl-stream-pick').innerHTML = '';
    document.getElementById('wl-lookup-status').textContent = '';
  }
  function renderSuggest(results) {
    document.getElementById('wl-suggest').innerHTML = results.map((r, idx) => {
      const name = r.title || r.name || '';
      const date = r.release_date || r.first_air_date || '';
      const meta = [r.media_type === 'tv' ? 'Series' : 'Movie', date.slice(0, 4), mapLang(r.original_language)].filter(Boolean).join(' · ');
      const img = r.poster_path
        ? '<img src="https://image.tmdb.org/t/p/w92' + escAttr(r.poster_path) + '" alt="">'
        : '<div class="noimg"></div>';
      return '<div class="wl-sug" data-idx="' + idx + '">' + img + '<div><div class="wl-sug-t">' +
        escapeHtml(name) + '</div><div class="wl-sug-m">' + escapeHtml(meta) + '</div></div></div>';
    }).join('');
  }

  function wlTitleTyped() {
    clearTimeout(suggestTimer);
    if (editingId || !tmdbKey()) return;       // typeahead only when adding
    const q = document.getElementById('f-title').value.trim();
    if (q.length < 3) { renderSuggest([]); return; }
    suggestTimer = setTimeout(wlLookup, 500);
  }

  async function wlLookup() {
    const status = document.getElementById('wl-lookup-status');
    if (!tmdbKey()) { openSettings('Add your TMDB key to look up titles.'); return; }
    const q = document.getElementById('f-title').value.trim();
    if (q.length < 2) { status.textContent = 'Type a title first.'; return; }
    const seq = ++lookupSeq;
    status.textContent = 'Searching…';
    try {
      const results = (await tmdbSearch(q)).slice(0, 6);
      if (seq !== lookupSeq) return;
      suggestResults = results;
      status.textContent = results.length ? 'Tap a match to auto-fill' : 'No matches found';
      renderSuggest(results);
    } catch (e) {
      if (seq !== lookupSeq) return;
      status.textContent = e && e.code === 401 ? 'TMDB rejected the key — check it in settings.' : 'Lookup failed — check your connection.';
    }
  }

  function wlPickSuggestion(idx) {
    const r = suggestResults[idx];
    if (!r) return;
    const e = entryFromResult(r);
    formMatch = e;
    if (!editingId) document.getElementById('f-title').value = e.name || document.getElementById('f-title').value;
    document.getElementById('f-type').value = r.media_type === 'tv' ? 'Series' : 'Movie';
    setSelectIfPresent('f-lang', mapLang(r.original_language));
    setSelectIfPresent('f-genre', primaryGenre(e.genres));
    renderSuggest([]);
    document.getElementById('wl-lookup-status').textContent =
      'Filled Type, Genre and Language from TMDB (' + e.name + (e.year ? ', ' + e.year : '') + ')';
    loadFormProviders(e);
  }

  async function loadFormProviders(e) {
    const box = document.getElementById('wl-stream-pick');
    box.innerHTML = '<span class="wl-form-note">Checking streaming in ' + tmdbCountry() + '…</span>';
    try {
      const data = await tmdb('/' + e.mt + '/' + e.id + '/watch/providers');
      const p = extractProviders(data, tmdbCountry());
      e.providers = p.names; e.link = p.link; e.provAt = Date.now(); e.cc = tmdbCountry();
      if (formMatch !== e) return;
      box.innerHTML = p.names.length
        ? '<span class="wl-form-note">Streaming in ' + tmdbCountry() + ' — tap one to set Platform:</span>' +
          p.names.map(n => '<div class="wl-pill" data-plat="' + escAttr(n) + '">' + escapeHtml(n) + '</div>').join('')
        : '<span class="wl-form-note">No subscription streaming listed in ' + tmdbCountry() + '.</span>';
    } catch (err) {
      if (formMatch === e) box.innerHTML = '';
    }
  }

  async function wlBulkImport() {
    const btn = document.getElementById('wl-bulk-btn');
    const original = btn.textContent;
    const existingKeys = new Set([
      ...sheetItems.map(i => keyOf(i.title)),
      ...pendingAdds.map(p => keyOf(p.title))
    ]);
    const toAdd = BULK_IMPORT_QUEUE.filter(item => !existingKeys.has(keyOf(item.title)));
    if (toAdd.length === 0) {
      btn.textContent = 'Already up to date';
      setTimeout(() => { btn.textContent = original; }, 2500);
      return;
    }
    btn.disabled = true;
    for (let idx = 0; idx < toAdd.length; idx++) {
      const item = toAdd[idx];
      btn.textContent = 'Sending ' + (idx + 1) + ' of ' + toAdd.length + '…';
      // queue entries still carry the old "Series - S1" style value; split it into Type + Genre (+ season in notes)
      const legacy = splitLegacy(item.genre, false) || { type: '', genre: item.genre || '', season: '' };
      const fields = {
        title: item.title,
        language: item.language,
        platform: item.platform,
        type: legacy.type,
        genre: legacy.genre,
        priority: 'medium',
        notes: [legacy.season, item.notes].filter(Boolean).join(' · ')
      };
      pendingAdds.unshift({ ...fields, status: 'to_watch', added: Date.now() });
      writeLS(LS_PENDING, pendingAdds);
      wlWriteToSheet({ action: 'add', ...sheetPayload(fields), status: 'To Watch' });
      render();
      await new Promise(r => setTimeout(r, 250));
    }
    btn.disabled = false;
    btn.textContent = '✓ Sent ' + toAdd.length + ' titles';
    setTimeout(() => { btn.textContent = original; }, 3000);
  }

  // ---------- init ----------
  function onChipClick(e) {
    const el = e.target.closest('[data-facet]');
    if (el) wlToggleFilter(el.dataset.facet, el.dataset.val);
  }

  function init() {
    overrides = readLS(LS_OVERRIDES, {});
    hidden = readLS(LS_HIDDEN, []);
    renamedAway = readLS(LS_RENAMED, {}) || {};
    pendingAdds = readLS(LS_PENDING, []).map(normalizeRow);
    const cached = readLS(LS_CACHE, null);
    if (cached) { sheetItems = cached.rows.map(normalizeRow); lastSynced = cached.syncedAt; }

    document.getElementById('wl-fpanel').addEventListener('click', onChipClick);
    document.getElementById('wl-active').addEventListener('click', onChipClick);
    tmdbCache = readLS(LS_TMDB_CACHE, {}) || {};
    document.getElementById('wl-suggest').addEventListener('click', function (e) {
      const el = e.target.closest('[data-idx]');
      if (el) wlPickSuggestion(Number(el.dataset.idx));
    });
    document.getElementById('wl-stream-pick').addEventListener('click', function (e) {
      const el = e.target.closest('[data-plat]');
      if (!el) return;
      setSelectIfPresent('f-platform', el.dataset.plat);
      document.getElementById('wl-lookup-status').textContent = 'Platform set to ' + el.dataset.plat;
    });
    document.getElementById('wl-list').addEventListener('click', function (e) {
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const act = el.dataset.act, id = el.dataset.id, kind = el.dataset.kind;
      if (act === 'cycle') wlCycleStatus(id, kind);
      else if (act === 'edit') wlEdit(id, kind);
      else if (act === 'del') wlDelete(id, kind);
      else if (act === 'clearall') wlClearAll();
    });

    render();
    wlSyncFromSheet();
  }

  init();
</script>
